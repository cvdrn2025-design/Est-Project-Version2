<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Daftar Harga Satuan (Bahan, Alat, Upah, Panel)</title>
  <style>
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    header {
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
    }

    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .select-group, .search-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 250px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
    }

    select, input[type="text"] {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      text-align: left;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f1f5f9;
      color: var(--primary-color);
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .text-right {
      text-align: right;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
    }

    .badge-bahan { background-color: #dbeafe; color: #1e40af; }
    .badge-alat { background-color: #fef3c7; color: #92400e; }
    .badge-upah { background-color: #dcfce7; color: #166534; }
    .badge-panel { background-color: #f3e8ff; color: #6b21a8; }

    .empty-message {
      text-align: center;
      padding: 24px;
      color: #94a3b8;
    }

    @media (max-width: 640px) {
      .control-panel {
        flex-direction: column;
      }
      .select-group, .search-group {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Daftar Harga Satuan Pekerjaan</h1>
      <p class="subtitle">Sistem Monitoring & Reference Harga Bahan, Alat, Upah, dan Panel</p>
    </header>

    <div class="control-panel">
      <!-- Dropdown Kategori -->
      <div class="select-group">
        <label for="category-select">Pilih Kategori Harga:</label>
        <select id="category-select" onchange="renderTable()">
          <option value="bahan">Daftar Harga Bahan</option>
          <option value="alat">Daftar Harga Alat</option>
          <option value="upah">Daftar Harga Upah</option>
          <option value="panel">Daftar Harga Panel</option>
        </select>
      </div>

      <!-- Input Pencarian -->
      <div class="search-group">
        <label for="search-input">Cari Nama Item / Uraian:</label>
        <input type="text" id="search-input" placeholder="Ketik kata kunci..." onkeyup="renderTable()">
      </div>
    </div>

    <!-- Container Tabel Data -->
    <div class="table-container">
      <table id="price-table">
        <thead>
          <tr>
            <th style="width: 80px;">No</th>
            <th>Uraian / Item</th>
            <th style="width: 120px;">Satuan</th>
            <th class="text-right" style="width: 200px;">Harga Satuan (Rp)</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Data diisi secara dinamis oleh JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Data Master Harga Satuan (Bahan, Alat, Upah, Panel)
    const databaseHarga = {
      bahan: [
        { nama: "Semen Portland (50 kg)", satuan: "Sak", harga: 75000 },
        { nama: "Pasir Pasang / Beton", satuan: "m³", harga: 250000 },
        { nama: "Batu Pecah / Split 2/3", satuan: "m³", harga: 280000 },
        { nama: "Besi Beton Polos / Ulir", satuan: "Kg", harga: 14500 },
        { nama: "Kayu Bekisting (Meranti 5/7)", satuan: "m³", harga: 3200000 },
        { nama: "Tripleks Tebal 9 mm", satuan: "Lembar", harga: 105000 },
        { nama: "Cat Tembok Exterior (20 kg)", satuan: "Pail", harga: 650000 },
        { nama: "Paku Campur (1\" - 4\")", satuan: "Kg", harga: 22000 }
      ],
      alat: [
        { nama: "Excavator Standard (0.8 m³)", satuan: "Jam", harga: 180000 },
        { nama: "Concrete Mixer / Molen (350L)", satuan: "Hari", harga: 150000 },
        { nama: "Dump Truck (6 m³)", satuan: "Hari", harga: 750000 },
        { nama: "Stamper Kuda / Pemadat", satuan: "Hari", harga: 120000 },
        { nama: "Concrete Vibrator", satuan: "Hari", harga: 100000 },
        { nama: "Generator Set 10 KVA", satuan: "Hari", harga: 200000 }
      ],
      upah: [
        { nama: "Pekerja Lapangan", satuan: "OH", harga: 130000 },
        { nama: "Tukang Batu", satuan: "OH", harga: 160000 },
        { nama: "Tukang Kayu", satuan: "OH", harga: 165000 },
        { nama: "Tukang Besi", satuan: "OH", harga: 165000 },
        { nama: "Tukang Cat", satuan: "OH", harga: 160000 },
        { nama: "Kepala Tukang", satuan: "OH", harga: 185000 },
        { nama: "Mandor Lapangan", satuan: "OH", harga: 200000 }
      ],
      panel: [
        { nama: "Panel Beton Precast (50 x 240 x 5 cm)", satuan: "Lembar", harga: 125000 },
        { nama: "Kolom Panel Beton Precast (225 cm)", satuan: "Batang", harga: 150000 },
        { nama: "Wall Panel WPC Dinding Wood (16 cm x 2.9 m)", satuan: "Batang", harga: 85000 },
        { nama: "Panel GRC Board (120 x 240 cm t=4mm)", satuan: "Lembar", harga: 70000 },
        { nama: "Panel Aluminium Composite (ACP 1.22 x 2.44 m t=4mm)", satuan: "Lembar", harga: 380000 },
        { nama: "Panel Surya / Solar Panel (300 WP Monocrystalline)", satuan: "Unit", harga: 1600000 },
        { nama: "Panel Listrik SDP (Distribution Board 40 x 60 cm)", satuan: "Unit", harga: 1850000 },
        { nama: "Panel Sandwich Dinding EPS (t=75 mm)", satuan: "m²", harga: 210000 }
      ]
    };

    // Fungsi Format Angka ke Rupiah
    function formatRupiah(angka) {
      return new Intl.NumberFormat('id-ID').format(angka);
    }

    // Fungsi Render Tabel
    function renderTable() {
      const category = document.getElementById('category-select').value;
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      const tbody = document.getElementById('table-body');
      
      tbody.innerHTML = '';

      const items = databaseHarga[category] || [];
      const filteredItems = items.filter(item => item.nama.toLowerCase().includes(searchQuery));

      if (filteredItems.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="empty-message">Data tidak ditemukan.</td>
          </tr>
        `;
        return;
      }

      filteredItems.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${index + 1}</td>
          <td><strong>${item.nama}</strong></td>
          <td><span class="badge badge-${category}">${item.satuan}</span></td>
          <td class="text-right">Rp ${formatRupiah(item.harga)}</td>
        `;
        tbody.appendChild(row);
      });
    }

    // Jalankan fungsi render saat halaman siap
    document.addEventListener("DOMContentLoaded", renderTable);
  </script>
</body>
</html>
